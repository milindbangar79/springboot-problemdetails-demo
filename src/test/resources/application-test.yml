spring:
  datasource:
    # Shared in-memory SQLite — all pool connections see the same DB
    url: jdbc:sqlite:file::memory:?cache=shared
  sql:
    init:
      mode: always
  # Disable virtual threads for tests: SQLite JDBC uses synchronized blocks that
  # pin virtual threads to carriers, causing starvation with Karate's HTTP client
  threads:
    virtual:
      enabled: false

# Pool size 1 — required for shared in-memory SQLite to avoid separate DB instances
hikari:
  maximum-pool-size: 1
  minimum-idle: 1
